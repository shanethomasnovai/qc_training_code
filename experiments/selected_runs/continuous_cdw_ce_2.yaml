# Selected historical configuration on current reviewed labels.
local_root: C:/Users/Shane/Desktop/qc_data

experiment_name: selected_continuous_cdw_ce_2

model:
  head: five_logits
  dropout_p: 0.5
  batch_normalization: false

data:
  dataset: reviewed_v2/multigrader_labels.xlsx
  target: exact_mean

training:
  seed: 7
  epochs: 50
  batch_size: 16
  patience: 10
  device: auto

optimizer:
  name: AdamW
  lr: 0.0003
  weight_decay: 0.05

scheduler:
  enabled: true
  factor: 0.5
  patience: 2
  min_lr: 1.0e-05

loss:
  name: continuous_cdw_ce
  class_weights:
    mode: none
  alpha: 1.0

evaluation:
  enable_test: false
