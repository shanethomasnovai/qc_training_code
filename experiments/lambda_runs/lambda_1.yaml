# Controlled lambda comparison: only binary_loss_weight changes.
local_root: C:/Users/Shane/Desktop/qc_data

experiment_name: or_soft_binary_lambda1_seed42

model:
  head: or_soft_binary
  dropout_p: 0.5
  batch_normalization: false

data:
  dataset: reviewed_v2/multigrader_labels.xlsx
  target: ordinal

training:
  seed: 42
  epochs: 100
  batch_size: 16
  patience: 10
  device: auto

optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.05

scheduler:
  enabled: true
  name: ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 2
  min_lr: 1.0e-05
  threshold: 0.001

loss:
  name: joint_bce
  class_weights:
    mode: none
  binary_loss_weight: 1.0

evaluation:
  enable_test: false
